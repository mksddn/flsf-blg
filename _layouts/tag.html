{% include /header-post.html %}

<div class="post-wrapper tag-page">
	<div class="post-title">
		<h1>{{ page.tag_title }}</h1>
		<div class="post-description">
			<span>{{ page.tag_description }}</span>
		</div>
	</div>
	<div class="tag-posts">
		{% for post in page.tag_posts %}
		<article class="tag-posts__item">
			<h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
			<p>{{ post.description | truncate: 160 }}</p>
		</article>
		{% endfor %}
	</div>
</div>

{% include /footer-post.html %}
